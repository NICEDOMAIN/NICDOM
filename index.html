<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NICDOM</title>
<meta name="description" content="NICDOM – Network Information Central Domain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Unbounded:wght@500;700&family=Vazirmatn:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0d12;--sub:#6e7480;--blue:30,107,255;--red:255,42,60;--cool:140,156,186}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#ffffff}
body{color:var(--ink);font-family:'Inter','Vazirmatn',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;background:#ffffff}
body.rtl{font-family:'Vazirmatn','Inter',system-ui,sans-serif}
.geo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
.gloss{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.85),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.5))}
.hero{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem 1.25rem;perspective:900px}
h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(2.2rem,10.5vw,6rem);letter-spacing:-.02em;line-height:1.1;
 transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;
 text-shadow:0 1px 0 #fff,0 2px 0 #f0f0ec,0 3px 0 #e8e8e4,0 4px 0 #e0e0dc,0 22px 28px rgba(20,25,40,.14);
 background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.95);border-radius:18px;padding:.35em .55em;
 -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
 box-shadow:0 12px 40px rgba(20,25,40,.08),inset 0 1px 1px #fff}
.rule{width:min(360px,62vw);height:1px;background:rgba(11,13,18,.22);margin:1.6rem 0 1.1rem}
.sub{color:var(--sub);font-weight:500;font-size:clamp(.72rem,2.3vw,.95rem);letter-spacing:.28em;text-transform:uppercase;line-height:2;padding-left:.28em;font-family:'Inter',sans-serif}
/* glass lamps – triangle layout: white apex, blue | dash | red base */
.lights{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;gap:10px 8px;align-items:center;justify-items:center;margin-top:2.6rem;padding:16px;width:min(200px,70vw)}
.lights .lamp.w{grid-column:1/-1;justify-self:center}
.lights .lamp.b{grid-column:1;grid-row:2;justify-self:end}
.lights .dash{grid-column:2;grid-row:2;width:22px;height:3px;border-radius:99px;position:relative;overflow:hidden;
 background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.9);
 box-shadow:0 0 0 1px rgba(20,25,40,.06),inset 0 1px 1px #fff}
.lights .dash::after{content:"";position:absolute;inset:0;width:40%;border-radius:inherit;background:rgba(255,255,255,.95);
 animation:dashSlide 1.8s ease-in-out infinite}
@keyframes dashSlide{0%,100%{transform:translateX(-20%);opacity:.35}50%{transform:translateX(180%);opacity:1}}
.lights .lamp.r{grid-column:3;grid-row:2;justify-self:start}
.lamp{width:20px;height:20px;border-radius:50%;position:relative;border:1px solid rgba(255,255,255,.98);padding:0;
 background:rgba(255,255,255,.78);
 box-shadow:0 0 0 1px rgba(20,25,40,.07),0 5px 12px rgba(20,25,40,.1),inset 0 1px 2px rgba(255,255,255,.98),inset 0 -4px 7px rgba(20,25,40,.05);
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lamp::before{content:"";position:absolute;left:3px;top:2px;width:9px;height:5px;border-radius:50%;background:linear-gradient(rgba(255,255,255,.98),rgba(255,255,255,0))}
.lamp .g{position:absolute;inset:-14px;border-radius:50%;pointer-events:none;opacity:.18}
.lamp.b{background:rgba(var(--blue),.42)}.lamp.b .g{background:radial-gradient(circle,rgba(var(--blue),.6),transparent 66%);animation:sb 6s ease-in-out infinite}
.lamp.r{background:rgba(var(--red),.42)}.lamp.r .g{background:radial-gradient(circle,rgba(var(--red),.6),transparent 66%);animation:sb 6s ease-in-out -3s infinite}
.lamp.w{background:rgba(255,255,255,.88);cursor:pointer;width:22px;height:22px}.lamp.w .g{background:radial-gradient(circle,rgba(var(--cool),.55),transparent 66%);animation:sb 6s ease-in-out -1.5s infinite}
@keyframes sb{0%,100%{opacity:.12}50%{opacity:.55}}
.lights.on .b .g{animation:fb 2.2s ease-in-out infinite}
.lights.on .r .g{animation:fb 2.2s ease-in-out -1.1s infinite}
.lights.on .w .g{animation:fw 2.2s ease-in-out infinite}
.lights.idle .w .g{animation:danceW 2.4s ease-in-out infinite}
.lights.idle .b .g,.lights.idle .r .g{animation:danceSide 2.4s ease-in-out infinite}
.lights.idle .r .g{animation-delay:-1.2s}
.lights.fast .g{animation-duration:.55s!important}
@keyframes fb{0%{opacity:0}5%{opacity:1}12%{opacity:.1}18%{opacity:1}28%{opacity:0}100%{opacity:0}}
@keyframes fw{0%,28%{opacity:0}36%{opacity:.9}44%{opacity:0}78%{opacity:0}86%{opacity:.9}94%{opacity:0}100%{opacity:0}}
@keyframes danceW{0%,100%{opacity:.2;transform:scale(.9)}25%{opacity:1;filter:hue-rotate(0deg)}50%{opacity:.35}75%{opacity:1;filter:hue-rotate(180deg)}}
@keyframes danceSide{0%,100%{opacity:.15}40%{opacity:.9}70%{opacity:.2}}
/* Hybrid hover-helicopter entity on site page */
.hybrid{position:fixed;z-index:70;width:72px;height:48px;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.6);
 transition:opacity .6s;will-change:left,top,transform;filter:drop-shadow(0 12px 20px rgba(20,25,40,.25))}
.hybrid.show{opacity:1}
.hybrid-body{position:absolute;inset:12px 8px 8px;border-radius:40% 40% 30% 30%;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(200,210,230,.55));
 border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 2px #fff,0 4px 12px rgba(20,25,40,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hybrid-rotor{position:absolute;left:50%;top:2px;width:56px;height:4px;margin-left:-28px;border-radius:2px;background:rgba(255,255,255,.5);
 transform-origin:center;animation:rotor 0.12s linear infinite}
@keyframes rotor{to{transform:rotate(360deg)}}
.hybrid-lights{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);display:flex;align-items:center;gap:4px}
.hybrid-lights i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.9);display:block}
.hybrid-lights i.hb{background:rgba(var(--blue),.7);box-shadow:0 0 8px rgba(var(--blue),.6)}
.hybrid-lights i.hw{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9);animation:hwPulse 1.6s ease-in-out infinite}
.hybrid-lights i.hr{background:rgba(var(--red),.7);box-shadow:0 0 8px rgba(var(--red),.6)}
.hybrid-lights .hd{width:10px;height:2px;border-radius:1px;background:rgba(255,255,255,.5);overflow:hidden;position:relative}
.hybrid-lights .hd::after{content:"";position:absolute;inset:0;width:50%;background:#fff;animation:dashSlide 1.2s ease-in-out infinite}
@keyframes hwPulse{0%,100%{opacity:.4}50%{opacity:1}}
.hybrid.fast .hybrid-rotor{animation-duration:.06s}
.hybrid.fast .hw{animation-duration:.35s}
.hybrid.idle .hw{animation:danceW 2.2s ease-in-out infinite}
.tip{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translate(-50%,6px);white-space:nowrap;font:500 .68rem 'Unbounded',sans-serif;letter-spacing:.08em;padding:.45rem .8rem;border-radius:99px;pointer-events:none;opacity:0;transition:.3s;
 background:rgba(255,255,255,.65);border:1px solid #fff;box-shadow:0 8px 20px rgba(20,25,40,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tip.show{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));width:1px;height:26px;background:linear-gradient(rgba(11,13,18,0),rgba(11,13,18,.25));transition:opacity .4s}
.scrolled .hint{opacity:0}
/* language lamps */
.langs{position:fixed;top:calc(.9rem + env(safe-area-inset-top,0px));right:1rem;z-index:6;display:flex;gap:9px}
.langs button{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.95);cursor:pointer;padding:0;position:relative;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
 box-shadow:0 0 0 1px rgba(20,25,40,.1),0 2px 5px rgba(20,25,40,.12),inset 0 1px 1px #fff}
.langs button[data-l=fa]{background:rgba(255,255,255,.8)}.langs button[data-l=ar]{background:rgba(var(--red),.5)}.langs button[data-l=en]{background:rgba(var(--blue),.5)}
.langs button.act{box-shadow:0 0 0 1px rgba(20,25,40,.1),0 0 0 4px rgba(20,25,40,.1),inset 0 1px 1px #fff}
/* game */
.game{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:3rem 1.25rem 9rem}
.arena{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(20,25,40,.16),0 0 0 1px rgba(20,25,40,.07);
 background:linear-gradient(180deg,#05070f,#0c1220)}
.arena canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{transition:opacity .9s;touch-action:pan-y;cursor:crosshair}
#cv.gone{opacity:0;pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;margin-top:1rem;font-size:.85rem;color:var(--sub)}
.pill{font:inherit;font-weight:600;font-size:.88rem;color:var(--ink);padding:.6rem 1.3rem;border-radius:99px;cursor:pointer;background:rgba(255,255,255,.65);border:1px solid #fff;box-shadow:0 8px 20px rgba(20,25,40,.1),inset 0 1px 1px #fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pill:hover{background:rgba(255,255,255,.9)}.pill:disabled{opacity:.4;cursor:default}
.msg{margin-top:.8rem;font-size:.92rem;min-height:1.4em}
.board{margin-top:1.6rem;padding:1.1rem 1.3rem;border-radius:18px;background:rgba(255,255,255,.55);border:1px solid #fff;box-shadow:0 8px 24px rgba(20,25,40,.07);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.board h3{font:500 .8rem 'Unbounded',sans-serif;margin-bottom:.6rem}
.board ol{list-style:none;font-size:.92rem}.board li{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid rgba(20,25,40,.07)}
.board li:first-child{font-weight:600}.board p{margin-top:.6rem;font-size:.82rem;color:var(--sub)}
#over{margin-top:.9rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
input{font:inherit;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid rgba(20,25,40,.14);border-radius:10px;padding:.6rem .8rem;width:100%}
[hidden]{display:none!important}
.stage{position:relative}
.stage.fs,.stage:fullscreen{position:fixed;inset:0;z-index:60;background:#03050b;display:grid;place-items:center}
.stage.fs .arena,.stage:fullscreen .arena{width:min(100vw,calc(100vh*16/9));border-radius:0;box-shadow:none}
.arena{font-family:'Orbitron','Vazirmatn',sans-serif}
.ctl{position:absolute;top:10px;right:10px;z-index:5;display:flex;gap:8px}
.gbtn{font:500 .68rem 'Orbitron',sans-serif;color:#eaf2ff;letter-spacing:.06em;padding:.45rem .85rem;border-radius:99px;cursor:pointer;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gbtn:hover{background:rgba(255,255,255,.22)}
.dock{position:absolute;left:0;right:0;bottom:12px;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:0 1rem;pointer-events:none;transition:opacity .3s}
.dock>*{pointer-events:auto}
.arena.playing .dock{opacity:0;pointer-events:none}
.arena.playing .dock>*{pointer-events:none}
.dock .info{font-size:.7rem;color:#9fb2d6;text-align:center;letter-spacing:.04em}
.dock .msg{margin:0;min-height:0;color:#fff;font-size:.8rem;text-align:center}
.dock .pill{background:rgba(255,255,255,.14);color:#eaf2ff;border-color:rgba(255,255,255,.32);font-family:'Orbitron','Vazirmatn',sans-serif;box-shadow:none}
.dock input{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.dock #over{margin:0;width:min(380px,92%)}
.welcome{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;opacity:0;text-align:center;padding:0 1rem;direction:ltr;
 font:900 clamp(1.1rem,5.2vw,2.7rem) 'Orbitron',sans-serif;letter-spacing:.18em;color:#e8f6ff;text-shadow:0 0 18px rgba(80,200,255,.9),0 0 44px rgba(40,120,255,.7)}
.welcome.show{animation:wl 3.6s ease forwards}
@keyframes wl{0%{opacity:0;filter:blur(14px);letter-spacing:.5em;transform:scale(1.08)}22%{opacity:1;filter:blur(0);letter-spacing:.18em;transform:scale(1)}78%{opacity:1}100%{opacity:0;filter:blur(6px)}}
#cv{z-index:3}
/* dialog */
dialog{margin:auto;border:1px solid #fff;border-radius:22px;background:rgba(255,255,255,.78);color:var(--ink);width:min(92vw,460px);padding:1.4rem;max-height:90vh;overflow:auto;box-shadow:0 30px 70px rgba(20,25,40,.25);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
dialog::backdrop{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog h2{font:700 1.05rem 'Unbounded',sans-serif;margin-bottom:.7rem}
dialog p{font-size:.9rem;line-height:1.75;margin-bottom:.7rem;color:#2c3039}
dialog form{display:grid;gap:.6rem;margin:.9rem 0}
.fee{font-weight:600;color:var(--ink)}
.note{font-size:.78rem!important;color:var(--sub)!important}
.row{display:flex;gap:.5rem}
.wallet-box{margin:1rem 0;padding:1rem;border-radius:14px;background:rgba(20,25,40,.04);border:1px solid rgba(20,25,40,.08)}
.wallet-box .card{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem .9rem;border-radius:12px;background:rgba(20,25,40,.06);direction:ltr;font-variant-numeric:tabular-nums;margin:.5rem 0}
.wallet-box .pill:disabled{opacity:.45;cursor:not-allowed}
.stats{margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(20,25,40,.08)}
.stats p{margin:.25rem 0;font-size:.85rem}
.chatbot{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));right:1rem;z-index:40}
.chat-toggle{width:52px;height:52px;border-radius:50%;border:1px solid #fff;background:rgba(255,255,255,.7);box-shadow:0 10px 28px rgba(20,25,40,.15);cursor:pointer;font-size:1.3rem;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.chat-panel{position:absolute;bottom:64px;right:0;width:min(320px,92vw);max-height:380px;display:flex;flex-direction:column;border-radius:16px;background:rgba(255,255,255,.88);border:1px solid #fff;box-shadow:0 20px 50px rgba(20,25,40,.2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);overflow:hidden}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;font:600 .85rem 'Unbounded',sans-serif;border-bottom:1px solid rgba(20,25,40,.08)}
.chat-head button{border:0;background:none;font-size:1.2rem;cursor:pointer;color:var(--sub)}
.chat-log{flex:1;overflow:auto;padding:.8rem;font-size:.82rem;line-height:1.55;min-height:140px}
.chat-log .bot{background:rgba(30,107,255,.08);border-radius:10px;padding:.5rem .7rem;margin-bottom:.5rem}
.chat-log .user{background:rgba(20,25,40,.06);border-radius:10px;padding:.5rem .7rem;margin-bottom:.5rem;text-align:right}
.chat-form{display:flex;gap:.4rem;padding:.6rem;border-top:1px solid rgba(20,25,40,.08)}
.chat-form input{flex:1;margin:0}
.chat-form .pill{padding:.5rem .9rem}
/* glass contact – only call icon, modern, black mirror on near */
.contact{position:fixed;left:50%;bottom:calc(2.2rem + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:1.1rem;transform:translate(-50%,40px);opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s,visibility 0s .45s}
.contact.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition-delay:0s}
.contact.hide-game{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#1a1d24;text-decoration:none;position:relative;overflow:hidden;
 background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.98);
 box-shadow:0 10px 28px rgba(20,25,40,.12),0 0 0 1px rgba(20,25,40,.05),inset 0 1px 1px #fff,inset 0 -8px 14px rgba(20,25,40,.04);
 -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
 transition:background .35s,color .35s,box-shadow .35s,transform .25s,border-color .35s}
.ico svg{width:22px;height:22px;position:relative;z-index:1}
.ico::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.6),rgba(255,255,255,0) 42%,rgba(255,255,255,.12) 72%);opacity:.75;transition:opacity .35s}
.ico.near,.ico:focus-visible{background:rgba(6,7,10,.88);color:#fff;border-color:rgba(255,255,255,.22);transform:scale(1.12);
 box-shadow:0 14px 36px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -12px 22px rgba(255,255,255,.05)}
.ico.near::before,.ico:focus-visible::before{opacity:1;background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,0) 46%,rgba(255,255,255,.08) 74%)}
.ico:active{transform:scale(.9)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);width:12px;height:12px;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(10);opacity:0}}
:focus-visible{outline:2px solid rgb(var(--blue));outline-offset:4px}
@media(prefers-reduced-motion:reduce){.lamp .g{animation:none!important;opacity:.3}h1{transition:none}}
</style>
</head>
<body>
<svg class="geo" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <defs><pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#10131a" stroke-width=".4" stroke-linejoin="round" opacity=".07">
      <g id="s"><rect x="20" y="20" width="80" height="80"/><rect x="20" y="20" width="80" height="80" transform="rotate(45 60 60)"/></g>
      <g transform="translate(60 60) scale(.5) translate(-60 -60)"><rect x="20" y="20" width="80" height="80"/><rect x="20" y="20" width="80" height="80" transform="rotate(45 60 60)"/></g>
      <g transform="translate(60 60) scale(.25) translate(-60 -60)"><rect x="20" y="20" width="80" height="80"/><rect x="20" y="20" width="80" height="80" transform="rotate(45 60 60)"/></g>
      <circle cx="60" cy="60" r="40"/>
      <use href="#s" transform="translate(-60 -60)"/><use href="#s" transform="translate(60 -60)"/><use href="#s" transform="translate(-60 60)"/><use href="#s" transform="translate(60 60)"/>
    </g></pattern></defs>
  <rect width="100%" height="100%" fill="url(#p)"/>
</svg>
<div class="gloss"></div>

<div class="langs" id="langs"><button data-l="fa" aria-label="فارسی"></button><button data-l="ar" aria-label="العربية"></button><button data-l="en" aria-label="English" class="act"></button></div>

<section class="hero">
  <h1 id="ttl">NICDOM</h1>
  <div class="rule"></div>
  <p class="sub">Network Information Centeral<br>Domain</p>
  <div class="lights" id="lights">
    <button class="lamp w" id="lw" aria-label="Tournament"><i class="g"></i><span class="tip" id="tip">Tournament</span></button>
    <span class="lamp b"><i class="g"></i></span>
    <span class="dash" aria-hidden="true"></span>
    <span class="lamp r"><i class="g"></i></span>
  </div>
<div id="hybrid" class="hybrid" aria-hidden="true">
  <div class="hybrid-rotor"></div>
  <div class="hybrid-body"></div>
  <div class="hybrid-lights"><i class="hb"></i><span class="hd"></span><i class="hw"></i><span class="hd"></span><i class="hr"></i></div>
</div>
  <div class="hint"></div>
</section>

<section class="game" id="game">
  <div class="stage" id="stage"><div class="arena" id="arena">
    <canvas id="gc" width="1280" height="720"></canvas>
    <div class="dock"><div class="info"><span id="mode"></span> · <span data-t="keys"></span></div><div class="msg" id="msg" role="status"></div><div id="over" hidden><input id="pn" maxlength="24" autocomplete="name"><button class="pill" id="sv" data-t="save"></button></div><button class="pill" id="play" data-t="play"></button></div>
    <div class="welcome" id="wl">WELCOME TO GALAXY</div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="ctl"><button class="gbtn" id="mute" type="button">♪</button><button class="gbtn" id="fs" data-t="fs"></button><button class="gbtn" id="fb" data-t="back" hidden></button></div>
  </div></div>
  <div class="board">
    <h3 data-t="board"></h3>
    <ol id="list"></ol>

/* ================================================================
   SPACE JOURNEY MUSIC – procedural, level-reactive
   Soft pads + drifting arpeggio + pulse. Intensity rises with level.
   ================================================================ */
var MUSIC={on:true,nodes:null,timer:null,step:0,level:0,master:null};
function musicStop(fade){
  if(!MUSIC.nodes)return;
  var n=ctx?ctx.currentTime:0,d=fade?1.8:.05;
  try{
    if(MUSIC.master){MUSIC.master.gain.cancelScheduledValues(n);MUSIC.master.gain.setValueAtTime(MUSIC.master.gain.value,n);MUSIC.master.gain.linearRampToValueAtTime(0,n+d)}
    MUSIC.nodes.forEach(function(o){try{o.stop(n+d+.05)}catch(e){}});
  }catch(e){}
  clearInterval(MUSIC.timer);MUSIC.timer=null;MUSIC.nodes=null;MUSIC.master=null;
}
function musicStart(){
  if(!MUSIC.on||!ctx)return;
  musicStop(false);
  if(ctx.state!=="running"){ctx.resume().then(function(){if(ctx.state==="running")musicStart()});return}
  var t0=ctx.currentTime+.08;
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  master.gain.linearRampToValueAtTime(.14,t0+2.5);
  MUSIC.master=master;MUSIC.nodes=[];MUSIC.step=0;MUSIC.level=0;

  /* Deep space pad – two detuned saws through lowpass */
  function pad(freq,vol,type){
    var o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type=type||"sawtooth";o.frequency.value=freq;
    f.type="lowpass";f.frequency.value=420;f.Q.value=.7;
    g.gain.value=vol;o.connect(f);f.connect(g);g.connect(master);
    o.start(t0);MUSIC.nodes.push(o);return {o:o,g:g,f:f};
  }
  var p1=pad(55,.045),p2=pad(82.4,.035),p3=pad(110,.025,"triangle");
  /* slow filter breathe */
  var now=t0;
  for(var i=0;i<40;i++){
    var tt=now+i*3.2;
    p1.f.frequency.setValueAtTime(380+MUSIC.level*40,tt);
    p1.f.frequency.linearRampToValueAtTime(520+MUSIC.level*60,tt+1.6);
    p1.f.frequency.linearRampToValueAtTime(380+MUSIC.level*40,tt+3.2);
  }

  /* Soft pulse (heartbeat of the ship) */
  var pulse=ctx.createOscillator(),pg=ctx.createGain();
  pulse.type="sine";pulse.frequency.value=2.2;
  pg.gain.value=.0;pulse.connect(pg);
  var click=ctx.createOscillator(),cg=ctx.createGain();
  click.type="sine";click.frequency.value=180;
  cg.gain.value=0;click.connect(cg);cg.connect(master);
  pulse.start(t0);click.start(t0);MUSIC.nodes.push(pulse,click);
  /* sidechain-ish: modulate click with LFO via script interval */

  /* Arpeggio notes – spacey pentatonic-ish */
  var scale=[130.8,155.6,196,233.1,261.6,311.1,392]; /* C minor-ish space */
  function arpOnce(when,intensity){
    var n=3+Math.min(4,intensity|0);
    for(var i=0;i<n;i++){
      var o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      var note=scale[(MUSIC.step+i*2)%scale.length]*(intensity>=8?2:1);
      o.type="triangle";o.frequency.value=note;
      f.type="lowpass";f.frequency.value=900+intensity*80;
      g.gain.setValueAtTime(0,when+i*.18);
      g.gain.linearRampToValueAtTime(.028+intensity*.004,when+i*.18+.04);
      g.gain.exponentialRampToValueAtTime(.001,when+i*.18+.55);
      o.connect(f);f.connect(g);g.connect(master);
      o.start(when+i*.18);o.stop(when+i*.18+.7);
      MUSIC.nodes.push(o);
    }
    MUSIC.step=(MUSIC.step+1)%scale.length;
  }

  /* High shimmer (stars) */
  var shim=ctx.createOscillator(),sg=ctx.createGain();
  shim.type="sine";shim.frequency.value=880;
  sg.gain.value=.008;shim.connect(sg);sg.connect(master);
  shim.frequency.setValueAtTime(880,t0);
  shim.frequency.linearRampToValueAtTime(1320,t0+12);
  shim.frequency.linearRampToValueAtTime(740,t0+28);
  shim.start(t0);MUSIC.nodes.push(shim);

  /* Schedule evolving phrase */
  function tick(){
    if(!MUSIC.master||!ctx)return;
    var inten=MUSIC.level;
    var t=ctx.currentTime+.05;
    arpOnce(t,inten);
    /* pulse click */
    cg.gain.cancelScheduledValues(t);
    cg.gain.setValueAtTime(0,t);
    cg.gain.linearRampToValueAtTime(.02+inten*.003,t+.02);
    cg.gain.exponentialRampToValueAtTime(.001,t+.12);
    /* pad volume lifts with level */
    var target=.12+Math.min(.1,inten*.012);
    master.gain.linearRampToValueAtTime(target,t+.8);
    /* tempo slightly faster at high levels */
    var gap=inten>=12?1.6:inten>=8?2.0:inten>=4?2.5:3.1;
    clearInterval(MUSIC.timer);
    MUSIC.timer=setInterval(tick,gap*1000);
  }
  MUSIC.timer=setInterval(tick,2800);
  setTimeout(tick,900);
}
function musicSetLevel(L){
  MUSIC.level=L|0;
  if(!MUSIC.master||!ctx)return;
  /* brighten filter on pads when level jumps */
  try{
    var t=ctx.currentTime;
    MUSIC.master.gain.linearRampToValueAtTime(.12+Math.min(.1,L*.012),t+.6);
  }catch(e){}
}
function musicToggle(){
  MUSIC.on=!MUSIC.on;
  $("mute").textContent=MUSIC.on?"♪":"♪̸";
  if(!MUSIC.on)musicStop(true);
  else if(G&&!G.over){unlock();musicStart()}
}

/* ---- SFX: shoot + game over + robotic hum ---- */
function sfxBeep(freq,dur,vol,type,slide){
  if(!ctx||!MUSIC.on)return;
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(freq,ctx.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,ctx.currentTime+dur);
  g.gain.setValueAtTime(0,ctx.currentTime);
  g.gain.linearRampToValueAtTime(vol,ctx.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
  o.connect(g);g.connect(ctx.destination);
  o.start();o.stop(ctx.currentTime+dur+.02);
}
function sfxShoot(){sfxBeep(880,.09,.07,"square",220);sfxBeep(1320,.05,.04,"sine",400)}
function sfxGameOver(){
  if(!ctx||!MUSIC.on)return;
  var t=ctx.currentTime;
  [440,330,220,165].forEach(function(f,i){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sawtooth";o.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*.22);g.gain.linearRampToValueAtTime(.1,t+i*.22+.05);g.gain.exponentialRampToValueAtTime(.001,t+i*.22+.5);
    o.connect(g);g.connect(ctx.destination);o.start(t+i*.22);o.stop(t+i*.22+.55);
  });
}
var ROBOT={hum:null,gain:null,lastMove:0,active:false};
function robotHumStart(){
  if(!ctx||ROBOT.hum)return;
  var o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
  o.type="sawtooth";o.frequency.value=48;
  f.type="bandpass";f.frequency.value=120;f.Q.value=4;
  g.gain.value=0;o.connect(f);f.connect(g);g.connect(ctx.destination);
  o.start();ROBOT.hum=o;ROBOT.gain=g;ROBOT.filter=f;ROBOT.active=true;
}
function robotHumMove(speed){
  if(!ROBOT.hum||!ctx)return;
  var t=ctx.currentTime;
  var vol=Math.min(.06,.012+speed*.0008);
  ROBOT.gain.gain.linearRampToValueAtTime(vol,t+.05);
  ROBOT.hum.frequency.linearRampToValueAtTime(48+Math.min(40,speed*.15),t+.08);
  ROBOT.filter.frequency.linearRampToValueAtTime(100+Math.min(200,speed*.5),t+.08);
  ROBOT.lastMove=performance.now();
}
function robotHumIdle(){

  if(spd>1.2){HYBRID.el.classList.add("fast");HYBRID.el.classList.remove("idle");robotHumMove(spd)}

function beep(f,t0,dur,vol,type){
  if(!ctx)return;
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||"square";o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.setValueAtTime(vol,t0+dur*.55);
  g.gain.linearRampToValueAtTime(0,t0+dur);
  o.connect(g);g.connect(ctx.destination);
  o.start(t0);o.stop(t0+dur+.02);
}
function sirenStart(dark){
  lights.classList.add("on");
  if(!ctx)return;
  if(ctx.state!=="running"){ctx.resume().then(function(){if(ctx.state==="running"&&!S)sirenStart(dark)});return}
  var t0=ctx.currentTime+.04;
  /* special dual "qezh-qezh" warning beeps – tight gap */
  beep(980,t0,.09,.18,"sawtooth");
  beep(720,t0+.11,.09,.16,"sawtooth");
  beep(980,t0+.28,.09,.17,"sawtooth");
  beep(720,t0+.39,.09,.15,"sawtooth");

  var s=t0+.7;
  var m=ctx.createGain(),lp=ctx.createBiquadFilter();
  m.gain.value=0;lp.type="lowpass";lp.frequency.value=2800;m.connect(lp);lp.connect(ctx.destination);
  var nodes=[];
  /* police-style dual-tone siren (hi-lo) */
  var hi=dark?880:1100,lo=dark?620:740;
  var o1=ctx.createOscillator(),o2=ctx.createOscillator();
  o1.type="sawtooth";o2.type="sawtooth";
  o1.frequency.setValueAtTime(hi,s);
  o2.frequency.setValueAtTime(lo,s);
  /* rhythmic dual pattern: short high, short low, small gap, repeat */
  var cycle=.55;
  for(var i=0;i<22;i++){
    var tt=s+i*cycle;
    o1.frequency.setValueAtTime(hi,tt);
    o1.frequency.linearRampToValueAtTime(lo,tt+cycle*.42);
    o1.frequency.setValueAtTime(hi,tt+cycle*.55);
    o2.frequency.setValueAtTime(lo,tt);
    o2.frequency.linearRampToValueAtTime(hi*.92,tt+cycle*.42);
    o2.frequency.setValueAtTime(lo,tt+cycle*.55);
  }
  var g1=ctx.createGain(),g2=ctx.createGain();
  g1.gain.value=.11;g2.gain.value=.09;
  o1.connect(g1);g1.connect(m);o2.connect(g2);g2.connect(m);
  o1.start(s);o2.start(s);nodes.push(o1,o2);

  var gn=m.gain,a=dark?.22:.16;
  gn.setValueAtTime(0,s);
  gn.linearRampToValueAtTime(a,s+.9);
  gn.setValueAtTime(a,s+9.5);
  gn.linearRampToValueAtTime(0,s+12.2);
  nodes.forEach(function(n){n.stop(s+12.4)});
  var tm=setTimeout(function(){S=null;done=true;lights.classList.remove("on")},(s-ctx.currentTime+12.5)*1000);
  S={dark:dark,stop:function(fast){
    clearTimeout(tm);var n=ctx.currentTime,d=fast?.1:1.4;
    var cur=gn.value;gn.cancelScheduledValues(n);gn.setValueAtTime(cur,n);gn.linearRampToValueAtTime(0,n+d);
    nodes.forEach(function(x){try{x.stop(n+d+.04)}catch(e){}});
    S=null;setTimeout(function(){if(!S)lights.classList.remove("on")},d*1000)}};
}

  G.e.push({ty:ty,hp:P.hp,r:P.r,vx:P.vx,am:P.am,x:W+28,y:y0,y0:y0,t:0,f:rnd(.7,1.5),flag:pickFlag(),split:false,z:1});

function step(dt){
  var v=speed(),scr=v*6.2;G.t+=dt;G.d+=v*dt;G.inv-=dt;G.sh-=dt;G.ban-=dt;G.rush-=dt;G.nitro-=dt;G.nitroCd-=dt;
  if(G.timeLeft>0)G.timeLeft-=dt;
  if(G.timeLeft<=0){G.timeLeft=0;G.over=true} /* winner condition: time reaches zero */

  var L=lvl();if(L!==G.L){G.L=L;G.ban=2.2;musicSetLevel(L)}
  var depth01=G.depthM/100;

  /* Depth: Enter deeper (0..100m). Backspace surface then exit zone up to 10m outside */
  if(!G.scoreLocked){
    if(keys.Enter){G.exterior=Math.max(0,G.exterior-dt*8);G.depthM=Math.min(100,G.depthM+dt*28)}
    if(keys.Backspace){
      if(G.depthM>0)G.depthM=Math.max(0,G.depthM-dt*32);
      else G.exterior=Math.min(10,G.exterior+dt*6);
    }
  }
  if(G.exterior>0.5){
    G.exitWarn+=dt;
    if(G.exitWarn>=10&&!G._escaped){G.scoreLocked=true;G.exitWarn=10;G._escaped=1;escapeToSite()}
  }else G.exitWarn=0;
  var controlLost=G.exterior>0.5||G.scoreLocked;

  if(!controlLost){
    var dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
    G.x=Math.max(16,Math.min(W-16,G.x+dx*240*dt));G.y=Math.max(14,Math.min(H-14,G.y+dy*240*dt));
  }else{
    G.x+=(G.mouseX-G.x)*dt*1.2;G.y+=(G.mouseY-G.y)*dt*1.2;
    G.x=Math.max(16,Math.min(W-16,G.x));G.y=Math.max(14,Math.min(H-14,G.y));
  }
  if(!controlLost&&(keys.ShiftLeft||keys.ShiftRight)){
    if(G.nitroCd<=0&&G.nitro<=0){
      G.nitro=2.8;G.nitroCd=7;
      /* brief music lift on nitro */
      if(MUSIC.master&&ctx){var t=ctx.currentTime;MUSIC.master.gain.linearRampToValueAtTime(.22,t+.05);MUSIC.master.gain.linearRampToValueAtTime(.12+Math.min(.1,MUSIC.level*.012),t+2.5)}
    }
  }

  G.cd-=dt;if(!controlLost&&keys.Space&&G.cd<=0){G.b.push({x:G.x+14,y:G.y,z:1});G.cd=.18;sfxShoot()}
  G.b.forEach(function(b){b.x+=580*dt});G.b=G.b.filter(function(b){return b.x<W+12});
  G.st.forEach(function(s){s.x-=scr*s.z*dt;if(s.x<0){s.x=W;s.y=rnd(0,H)}});

  if(G.d>=CONFIG.obstacleStart){G.sp-=dt;if(G.sp<=0){
    G.sp=Math.max(.45,1.4-(G.d-CONFIG.obstacleStart)/4800)*rnd(.65,1.25);
    var r=rnd(10,24),pts=[];for(var i=0;i<9;i++)pts.push(rnd(.72,1.12));
    G.o.push({x:W+32,y:rnd(22,H-22),r:r,ex:rnd(0,38),pts:pts,a:rnd(0,6),z:1-depth01*.35})}}
  if(L>=1){G.es-=dt;if(G.es<=0){
    G.es=[0,2.6,2.0,1.5,1.15,1.0,.9,.8,.7,.65,.6,.55,.5][Math.min(L,12)]*rnd(.75,1.2);
    spawnEnemy(L)}}
  if(L>=12){
    if(Math.random()<.012)G.jets.push({x:-40,y:rnd(40,H-40),vx:320,life:4.5,side:1});
    if(Math.random()<.008)G.helis.push({x:W+30,y:rnd(30,H-30),vx:-180,life:5,rot:0});
  }
  G.o.forEach(function(o){
    o.x-=(scr+o.ex)*dt*(1+depth01*.4);
    o.a+=dt;o.z=Math.max(.4,o.z-depth01*dt*.15);
  });G.o=G.o.filter(function(o){return o.x>-50});
  G.e.forEach(function(e){e.t+=dt;
    if(e.ty===0||e.t<8){if(e.ty===0||e.x>W*.6)e.x-=(e.vx+scr*.35)*dt*(1+depth01*.3)}else e.x+=100*dt;
    e.y=e.y0+Math.sin(e.t*2.1)*e.am;
    e.z=Math.max(.5,1-depth01*.4);
    if(e.ty>0&&e.x<W-16&&e.t<8){e.f-=dt;if(e.f<=0){e.f=(e.ty===1?1.7:2.3)*(L>=4?.75:1);
      var a=Math.atan2(G.y-e.y,G.x-e.x),n=e.ty===2?3:1;
      for(var i=0;i<n;i++){var aa=a+(n>1?(i-1)*.26:0);G.eb.push({x:e.x,y:e.y,vx:Math.cos(aa)*200,vy:Math.sin(aa)*200,bounce:0})}}}});
  G.e=G.e.filter(function(e){
    if(e.x<-50||(e.t>8&&e.ty>0&&e.x>W+50)){if(e.flag)delete usedFlags[e.flag];return false}
    return true;
  });
  /* Enemy bullets: bounce on edges, change color, never leave screen */
  G.eb.forEach(function(b){
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<4||b.x>W-4){b.vx*=-1;b.bounce=(b.bounce||0)+1;b.x=Math.max(4,Math.min(W-4,b.x))}
    if(b.y<4||b.y>H-4){b.vy*=-1;b.bounce=(b.bounce||0)+1;b.y=Math.max(4,Math.min(H-4,b.y))}
  });
  G.eb=G.eb.filter(function(b){return (b.bounce||0)<6});
  G.pt.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});G.pt=G.pt.filter(function(p){return p.l>0});
  G.jets.forEach(function(j){j.x+=j.vx*dt;j.life-=dt});G.jets=G.jets.filter(function(j){return j.life>0&&j.x<W+60});
  G.helis.forEach(function(h){h.x+=h.vx*dt;h.rot+=dt*4;h.life-=dt});G.helis=G.helis.filter(function(h){return h.life>0&&h.x>-60});

  /* collisions bullets vs obstacles/enemies – hit reduces timeLeft */
  G.b.forEach(function(b){
    G.o.forEach(function(o){if(!o.dead&&!b.dead&&Math.hypot(b.x-o.x,b.y-o.y)<o.r+4){
      o.dead=b.dead=1;G.k++;G.timeLeft=Math.max(0,G.timeLeft-1.8);boom(o.x,o.y,"#9fb2d6")}});
    G.e.forEach(function(e){if(!e.dead&&!b.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){
      b.dead=1;e.hp--;boom(b.x,b.y,"#6fe3ff");
      if(e.hp<=0){
        e.dead=1;G.k++;G.timeLeft=Math.max(0,G.timeLeft-2.6);boom(e.x,e.y,"#ffb36b");
        /* split into two smaller on kill (if not already split) */
        if(!e.split&&e.ty>0){
          for(var s=0;s<2;s++){
            G.e.push({ty:0,hp:1,r:e.r*.55,vx:e.vx*1.3,am:e.am*.6,x:e.x,y:e.y+(s?12:-12),y0:e.y+(s?12:-12),t:0,f:1,flag:pickFlag(),split:true,z:e.z});
          }
        }
      }
    }})});
  G.o.forEach(function(o){if(!o.dead&&Math.hypot(G.x-o.x,G.y-o.y)<o.r*.88+9){o.dead=1;hurt()}});
  G.e.forEach(function(e){if(!e.dead&&Math.hypot(G.x-e.x,G.y-e.y)<e.r+8){e.dead=1;hurt()}});
  G.eb=G.eb.filter(function(b){if(Math.hypot(G.x-b.x,G.y-b.y)<9){hurt();return false}return true});
  G.o=G.o.filter(function(o){return!o.dead});G.e=G.e.filter(function(e){return!e.dead});G.b=G.b.filter(function(b){return!b.dead});
}

function loop(now){

}

    {k:/امتیاز|رتبه|آخرین|شانس|۳|سه/i,a:"فقط آخرین بازی از ۳ شانس رتبه‌دار ثبت می‌شود. تمرین قبل از پرداخت ثبت نمی‌شود. ۳ نفر برتر با نام (بدون آدرس والت) عمومی هستند."},
    {k:/عمق|اینتر|بک|خروج|اخطار/i,a:"اینتر تا ۱۰۰ متر عمق. بک‌اسپیس برگشت و خروج تا ۱۰ متر. بیرون صفحه: اخطار ۱۰ ثانیه‌ای — اگر برنگردید امتیاز صفر می‌شود ولی بازی ادامه دارد."},

function chatAnswer(q){
  var list=chatReplies[lang]||chatReplies.en;
  for(var i=0;i<list.length;i++)if(list[i].k.test(q))return list[i].a;
  return list[list.length-1].a;
}
function chatAdd(cls,text){
  var d=document.createElement("div");d.className=cls;d.textContent=text;$("chatLog").appendChild(d);$("chatLog").scrollTop=1e9;
}
$("chatToggle").onclick=function(){$("chatPanel").hidden=!$("chatPanel").hidden;if(!$("chatPanel").hidden&&!$("chatLog").children.length)chatAdd("bot",chatAnswer("hello"))};
$("chatClose").onclick=function(){$("chatPanel").hidden=true};
$("chatForm").onsubmit=function(e){
  e.preventDefault();
  var q=$("chatIn").value.trim();if(!q)return;
  chatAdd("user",q);$("chatIn").value="";
  setTimeout(function(){chatAdd("bot",chatAnswer(q))},280);
};
